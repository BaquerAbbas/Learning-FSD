<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
      }

      .pricing-container {
        display: flex;
        flex-direction: row;
        gap: 20px;
        justify-content: center;
        align-items: center;
        height:100vh;
      
      }

      .plan-price {
        font-size: 2rem;
        margin: 3%
      }
      p {
        font-weight: 700;;
      }

      .pricing-plan{
        background-color: lightgray;
        flex-basis: 300px;
        text-align: center;
        padding: 2%;
        border-radius: 20px;  

      }


      .plan-features {
        list-style: none;
        font-size: smaller;
        align-self: center;
      }

      .plan-button{
        background-color:coral;
        color: white;
        border: 0;
        padding: 2%;
        margin-top: 5%;
        border-radius: 5px;
      }


      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container {
         flex-direction: column;
          gap: 20px;
          flex-basis: 243332200px;
        }
      .pricing-plan{ 
        flex-basis: 170px;
        width: 250px;
      }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title"><p>Basic</p></div>
        <div class="plan-price"><p>$9.99/month</p></div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title"><p>Standard</p></div>
        <div class="plan-price"><p>$19.99/month</p></div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title"><p>Premium</p></div>
        <div class="plan-price"><p>$49.99/month</p></div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
